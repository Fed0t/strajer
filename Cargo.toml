[workspace]
members = [
    "apps/strajer-agent",
    "apps/strajer-server",
    "crates/strajer-lan",
    "crates/strajer-protocol",
    "crates/strajer-w3gs",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0.100"
async-dnssd = "0.5.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
crc32fast = "1.5.0"
futures-util = "0.3.34"
hex = "0.4.3"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.8"
