services:
  strajer-server:
    build:
      context: .
      dockerfile: deploy/server/Dockerfile
    environment:
      RUST_LOG: ${STRAJER_RUST_LOG:-strajer_server=info,tower_http=info}
      STRAJER_BIND_ADDR: 0.0.0.0:8080
      STRAJER_HEALTHCHECK_ADDR: 127.0.0.1:8080
    ports:
      - "${STRAJER_PUBLISH_ADDR:-127.0.0.1}:${STRAJER_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
